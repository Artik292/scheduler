name: "Build and Deploy to Cloud Run"

on:
  push:
    branches: ["main", "v2"]
  pull_request:
    branches: ["main", "v2"]

env:
  REGION: "europe-north1"
  REPO: "vecaku-diena"
  DOCKER_IMAGE_NAME: "vecaku-diena"
  TAG: $( date +%Y-%m-%d_%H-%M )

jobs:
  deploy:
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"

        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build the docker image
        run: docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.DOCKER_IMAGE_NAME }}:latest .

      - name: Push the docker image (latest)
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Push the docker image (version)
        run: |
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.DOCKER_IMAGE_NAME }}:latest ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.TAG }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.TAG }}

      - name: "Deploy to Cloud Run"
        uses: "google-github-actions/deploy-cloudrun@v2" # "google-github-actions/deploy-cloudrun@33553064113a37d688aa6937bacbdc481580be17"
        with:
          service: "${{ env.REPO }}"
          region: "${{ env.REGION }}"
          # NOTE: If using a pre-built image, update the image name below:

          image: "${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
